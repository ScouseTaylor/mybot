<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TikTok Authorization - Discord TikTok Notifications</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:760px;margin:60px auto;padding:0 20px;line-height:1.6;color:#222;background:#fafafa}
    .card{background:#fff;padding:28px;border:1px solid #ddd;border-radius:12px}
    h1{margin-top:0;color:#111}
    .ok{color:#157347;font-weight:700}.err{color:#b02a37;font-weight:700}.warn{color:#8a6d00;font-weight:700}
    textarea{width:100%;min-height:92px;box-sizing:border-box;padding:10px;font-family:monospace}
    button{background:#111;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
    a{color:#111}.small{font-size:14px;color:#555}
  </style>
</head>
<body>
  <div class="card">
    <h1>Discord TikTok Notifications</h1>
    <div id="result"></div>
  </div>

  <script>
    const result = document.getElementById('result');
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const errorDescription = params.get('error_description');
    const code = params.get('code');
    const returnedState = params.get('state');
    const scopes = params.get('scopes');
    const expectedState = sessionStorage.getItem('tiktok_oauth_state');

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    if (error) {
      result.innerHTML = '<p class="err">TikTok authorization was not completed.</p>' +
        '<p>' + escapeHtml(errorDescription || error) + '</p>' +
        '<p><a href="connect.html">Try again</a></p>';
    } else if (!code) {
      result.innerHTML = '<p class="err">No authorization code was returned by TikTok.</p>' +
        '<p><a href="connect.html">Start again</a></p>';
    } else if (!expectedState || returnedState !== expectedState) {
      result.innerHTML = '<p class="warn">The security check did not match.</p>' +
        '<p>Please start the TikTok connection again from the Connect TikTok page.</p>' +
        '<p><a href="connect.html">Start again</a></p>';
    } else {
      result.innerHTML = '<p class="ok">TikTok authorization successful.</p>' +
        '<p>Granted scopes: <strong>' + escapeHtml(scopes || 'not reported') + '</strong></p>' +
        '<p>The temporary authorization code below must be exchanged by your local bot for an access token. Keep it private and do not post it in chat.</p>' +
        '<textarea id="code" readonly>' + escapeHtml(code) + '</textarea>' +
        '<button id="copy">Copy authorization code</button>' +
        '<p id="copied" class="small"></p>';

      document.getElementById('copy').addEventListener('click', async () => {
        await navigator.clipboard.writeText(code);
        document.getElementById('copied').textContent = 'Copied. Keep this code private.';
      });
    }
  </script>
</body>
</html>
