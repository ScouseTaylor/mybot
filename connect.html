<script>
  const CLIENT_KEY = 'sbawpmerm4ct43lxx9';
  const REDIRECT_URI = 'https://airplane-andreas-bin-campbell.trycloudflare.com/tiktok/callback';
  const SCOPES = 'user.info.basic,video.list';

  function randomState() {
    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    return Array.from(bytes, b =>
      b.toString(16).padStart(2, '0')
    ).join('');
  }

  document.getElementById('connect').addEventListener('click', () => {
    const pageParams = new URLSearchParams(window.location.search);
    const username = pageParams.get('username');

    const random = randomState();

    const state = username
      ? `${username}__${random}`
      : random;

    sessionStorage.setItem('tiktok_oauth_state', state);

    const oauthParams = new URLSearchParams({
      client_key: CLIENT_KEY,
      response_type: 'code',
      scope: SCOPES,
      redirect_uri: REDIRECT_URI,
      state,
      disable_auto_auth: '1'
    });

    window.location.href =
      'https://www.tiktok.com/v2/auth/authorize/?' +
      oauthParams.toString();
  });
</script>
